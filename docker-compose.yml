version: "3.8"

services:
  # ── Infrastructure ──────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: indra_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=indra
      - POSTGRES_PASSWORD=marketmind
      - POSTGRES_DB=marketmind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indra -d marketmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: indra_redis
    ports:
      - "6379:6379"

  # ── Gateway ─────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: indra_gateway
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - ENVIRONMENT=production
    depends_on:
      - data-service
      - sentiment-service
      - analytics-service
      - forecast-service

  # ── Core Microservices ──────────────────────────────
  data-service:
    build:
      context: .
      dockerfile: services/data_ingestion/Dockerfile
    container_name: indra_data
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://indra:marketmind@postgres:5432/marketmind
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./services/data_ingestion:/app/services/data_ingestion
      - ./shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  sentiment-service:
    build:
      context: .
      dockerfile: services/sentiment/Dockerfile
    container_name: indra_sentiment
    ports:
      - "8002:8002"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://indra:marketmind@postgres:5432/marketmind
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    container_name: indra_analytics
    ports:
      - "8003:8003"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://indra:marketmind@postgres:5432/marketmind
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  forecast-service:
    build:
      context: .
      dockerfile: services/forecasting/Dockerfile
    container_name: indra_forecast
    ports:
      - "8004:8004"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://indra:marketmind@postgres:5432/marketmind
    depends_on:
      - postgres

  alert-service:
    build:
      context: .
      dockerfile: services/alerts/Dockerfile
    container_name: indra_alerts
    ports:
      - "8005:8005"
    env_file: .env
    depends_on:
      - postgres

  rag-chatbot:
    build:
      context: .
      dockerfile: services/rag_chatbot/Dockerfile
    container_name: indra_chatbot
    ports:
      - "8006:8006"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://indra:marketmind@postgres:5432/marketmind
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - postgres

  auto-trading:
    build:
      context: .
      dockerfile: services/auto_trading/Dockerfile
    container_name: indra_auto_trading
    ports:
      - "8007:8007"
    env_file: .env
    environment:
      - ACTIVE_BROKER=paper
      - MAX_RISK_PER_TRADE=${MAX_RISK_PER_TRADE:-0.02}
    depends_on:
      - alert-service

  multimodal-service:
    build:
      context: .
      dockerfile: services/multimodal/Dockerfile
    container_name: indra_multimodal
    ports:
      - "8008:8008"
    env_file: .env
    environment:
      - SENTIMENT_SERVICE_URL=http://sentiment-service:8002/analyze
    depends_on:
      - sentiment-service

  crypto-onchain-service:
    build:
      context: .
      dockerfile: services/crypto_onchain/Dockerfile
    container_name: indra_crypto_onchain
    ports:
      - "8009:8009"
    env_file: .env

  alternative-data-service:
    build:
      context: .
      dockerfile: services/alternative_data/Dockerfile
    container_name: indra_alt_data
    ports:
      - "8010:8010"
    env_file: .env

  # ── Frontend Dashboard ──────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: indra_dashboard
    ports:
      - "8501:8501"
    environment:
      - API_GATEWAY_URL=http://gateway:8000
    volumes:
      - ./dashboard:/app/dashboard
      - ./shared:/app/shared
    depends_on:
      - gateway
      - data-service
      - sentiment-service

volumes:
  postgres_data:
