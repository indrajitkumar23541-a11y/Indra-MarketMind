name: Build Native Android APK

on:
  push:
    branches: [main]
    paths:
      - 'frontend/android/**'
      - 'frontend/capacitor.config.ts'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Java 17 Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Synchronize Capacitor Native Platform
        working-directory: frontend
        run: npm run cap sync android || npx --yes @capacitor/cli sync android || true

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x frontend/android/gradlew

      - name: Compile Standalone Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Copy & Rename APK
        run: |
          mkdir -p output_apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk output_apk/Indra-MarketMind.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Indra-MarketMind-Android-APK
          path: output_apk/Indra-MarketMind.apk
          retention-days: 30

      - name: Publish or Update GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: android-v1.0
          name: "Indra-MarketMind Native Android App v1.0"
          body: |
            ## 🚀 Indra-MarketMind Native Standalone Android APK
            
            Download and install the native Android APK directly on your phone:
            - **No Chrome Dependency:** Launches directly into its own isolated native app shell.
            - **Native App Lock & Fingerprint Support:** Recognizable by Android OS system settings for privacy locking.
            - **Live Synchronization:** Connected to real-time market data, AI Copilot, and cloud analytics.
            
            ### 📥 Download:
            Click on **`Indra-MarketMind.apk`** below to download and install on any Android phone.
          files: output_apk/Indra-MarketMind.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
